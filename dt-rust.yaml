# Description of how to augment the devicetree for Rust.
#
# Each entry describes an augmentation that will be added to matching nodes in the device tree.
# The full syntax is described (indirectly) in `zephyr-build/src/devicetree/config.rs`.

# Gpio controllers match for every node that has a `gpio-controller` property.  This is one of the
# few instances were we can actually just match on a property.
- name: gpio-controller
  cfg: CONFIG_GPIO
  rules:
    - !HasProp gpio-controller
  actions:
    - !Instance
      raw: !Myself
      device: crate::device::gpio::Gpio
      static_type: crate::device::gpio::GpioStatic

# The gpio-leds node will have #children nodes describing each led.  We'll match on the parent
# having this compatible property.  The nodes themselves are built out of the properties associated
# with each gpio.
- name: gpio-leds
  cfg: CONFIG_GPIO
  rules:
    - !Compatible
      names: [gpio-leds]
      level: 1
  actions:
    - !Instance
      raw: !Phandle gpios
      device: crate::device::gpio::GpioPin

# The gpio-keys node will have #children nodes describing each key.  We'll match on the parent
# having this compatible property.  The nodes themselves are built out of the properties associated
# with each gpio.
- name: gpio-keys
  rules:
    - !Compatible
      names: [gpio-keys]
      level: 1
  actions:
    - !Instance
      raw: !Phandle gpios
      device: crate::device::gpio::GpioPin

# Flash controllers don't have any particular property to identify them, so we need a list of
# compatible values that should match.
- name: flash-controller
  cfg: CONFIG_FLASH
  rules:
    - !Compatible
      names:
        - "nordic,nrf51-flash-controller"
        - "nordic,nrf52-flash-controller"
        - "nordic,nrf53-flash-controller"
        - "nordic,nrf91-flash-controller"
        - "raspberrypi,pico-flash-controller"
        - "zephyr,sim-flash"
        - "st,stm32-flash-controller"
        - "nxp,msf1"
        - "espressif,esp32-flash-controller"
      level: 0
  actions:
    - !Instance
      raw: !Myself
      device: crate::device::flash::FlashController

# Flash partitions exist as children of a node compatible with "soc-nv-flash" that itself is a child
# of the controller itself.
# TODO: Get the write and erase property from the DT if present.
- name: flash-partition
  cfg: CONFIG_FLASH
  rules:
    - !Compatible
      names:
        - "fixed-partitions"
      level: 1
    - !Compatible
      names:
        - "soc-nv-flash"
      level: 2
  actions:
    - !Instance
      raw: !Parent
        level: 3
        args:
          - !Reg
      device: "crate::device::flash::FlashPartition"

# The temperature-sensor node.
- name: temperature-sensor
  cfg: CONFIG_SENSOR
  rules:
    - !Compatible
      names:
        - "ti,tmp11x_rs"
        - "ti,tmp11x"
      level: 0
  actions:
    - !Instance
      raw: !Myself
      device: crate::device::temperature_sensor::TemperatureSensor

# Matcher for 'PwmFan' from pwm_fan.rs
- name: pwm-fan
  cfg: CONFIG_PWM
  rules:
    - !Compatible
      names: ["pwm-fan"]
      level: 0
  actions:
    - !Instance
      raw: !Phandle pwms
      device: crate::device::pwm_fan::PwmFan
      properties:
        - name: max-rpm
          type: Int
        - name: min-rpm
          type: Int
        - name: min-start-rpm
          type: Int
        - name: tachometer
          type: !Phandle
            device: crate::device::tachometer::Tachometer
          optional: true

# Matcher for `Pwm` from pwm.rs.
- name: pwm-controller
  cfg: CONFIG_PWM
  rules:
    - !HasProp "#pwm-cells"
  actions:
    - !Instance
      raw: !Myself
      device: crate::device::pwm::Pwm

# A tachometer (RPM sensor).  In Zephyr every tachometer driver is a regular `sensor` device that
# reports on the `SENSOR_CHAN_RPM` channel, so a single wrapper works for all of them.  This augment
# makes any matching tach node expose the raw accessors so it can be referenced by a phandle (e.g.
# the `tach-device` property of a `pwm-fan`).
- name: tachometer
  cfg: CONFIG_SENSOR
  rules:
    - !Compatible
      names:
        - "zephyr,tach-gpio"
        - "nuvoton,npcx-tach"
        - "microchip,xec-tach"
        - "ite,it8xxx2-tach"
        - "ite,it51xxx-tach"
        - "ene,kb1200-tach"
        - "realtek,rts5912-tach"
      level: 0
  actions:
    - !Instance
      raw: !Myself
      device: crate::device::tachometer::Tachometer

# Matcher for `Uart` from uart.rs.
- name: uart
  cfg: CONFIG_SERIAL
  rules:
    - !Compatible
      names:
        - "nxp,lpc-usart" # u_Note: Should probably pull in more eventually but this is what i have
      level: 0
  actions:
    - !Instance
      raw: !Myself
      device: crate::device::uart::Uart
      static_type: crate::device::uart::UartStatic

# Matcher for `RtcRaw` from rts.rs
- name: rtc-raw
  cfg: CONFIG_RTC
  rules:
    - !Compatible
      names:
        - "zephyr,rtc-emul"
      level: 0
  actions:
    - !Instance
      raw: !Myself
      device: crate::device::rtc::RtcRaw

# Matcher for `Rtc` from rtc.rs.
- name: rtc
  cfg: CONFIG_RTC
  rules:
    - !Compatible
      names:
        - "rs,rtc"
      level: 0
  actions:
    - !Instance
      raw: !Phandle {property: rtc, device: crate::device::rtc::RtcRaw}
      device: crate::device::rtc::Rtc
      properties:
        - name: resolution-hz # The resolution of this RTC in Hz. This value represents the finest time granularity the hardware can store.
          type: Int

# Rec: Unfortunately it looks like there isn't a single property we can check for all fuel gauges,
# but I don't want to manually list every single fuel gauge compatible here either. For now
# I think it's fine to just list the sbs compatible (and remove fuel-gauge-emul since that won't
# be upstreamed) and make a note in the PR description of this limitation and that maybe some other way
# will have to be explored in the future to automatically make this work for all fuel gauges.
# Matcher for `FuelGauge` from fuel_gauge.rs.
- name: fuel-gauge
  cfg: CONFIG_FUEL_GAUGE
  rules:
    - !Compatible
      names:
        - "sbs,sbs-gauge-new-api"
        - "zephyr,fuel-gauge-emul"
      level: 0
  actions:
    - !Instance
      raw: !Myself
      device: crate::device::fuel_gauge::FuelGauge

# Generate a pseudo node that matches all of the labels across the tree with their nodes.
- name: labels
  rules:
    - !Root
  actions:
    - !Labels
